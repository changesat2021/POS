<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .nav-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-link { flex: 1; padding: 12px; text-align: center; background: #ddd; color: #333; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .active { background: #2c3e50; color: white; }
        
        .box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; font-weight: bold; cursor: pointer; }
        
        .row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="nav-link">POS</a>
    <a href="inventory.html" class="nav-link active">Stock</a>
    <a href="floating.html" class="nav-link">Waiter</a>
</div>

<div class="box">
    <h3>Add / Restock Material</h3>
    <input type="text" id="i-id" placeholder="ID (matches code, e.g. sugar)">
    <input type="text" id="i-name" placeholder="Name (e.g. Sugar)">
    <input type="number" id="i-qty" placeholder="Quantity to Add">
    <button onclick="addStock()">ADD STOCK</button>
</div>

<div class="box">
    <h3>Current Stock Levels</h3>
    <div id="list">Loading...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAKqsixs_luzjqCY1ZCqrKRtn77wcJs5Iw",
        authDomain: "bean-5a113.firebaseapp.com",
        projectId: "bean-5a113",
        storageBucket: "bean-5a113.firebasestorage.app",
        messagingSenderId: "702927377502",
        appId: "1:702927377502:web:9e50192a0c431da69850cf"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadInv() {
        db.collection('inventory').onSnapshot(snap => {
            let html = '';
            snap.forEach(doc => {
                const d = doc.data();
                html += `<div class="row">
                    <span><b>${d.name}</b> <small>(${doc.id})</small></span>
                    <b>${d.qty}</b>
                </div>`;
            });
            document.getElementById('list').innerHTML = html;
        });
    }

    async function addStock() {
        const id = document.getElementById('i-id').value;
        const name = document.getElementById('i-name').value;
        const qty = parseFloat(document.getElementById('i-qty').value);

        if(!id || !qty) return alert("Fill ID and Qty");

        const ref = db.collection('inventory').doc(id);
        const doc = await ref.get();

        if(doc.exists) {
            await ref.update({ qty: firebase.firestore.FieldValue.increment(qty) });
        } else {
            await ref.set({ name: name, qty: qty });
        }
        alert("Stock Updated");
    }

    loadInv();
</script>
</body>
</html>
