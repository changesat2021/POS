<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bean & Bloom POS - Final</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
:root { --primary:#6F4E37; --food:#d35400; --accent:#2c3e50; --white:#fff; --radius:10px; }
body{margin:0;font-family:sans-serif;background:#f4f4f4;padding-bottom:80px}
.container{max-width:650px;margin:auto;padding:15px}
header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
.dashboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{background:#fff;padding:12px;border-radius:10px;text-align:center;border:1px solid #eee}
.val{font-size:1.1rem;font-weight:800}
.lbl{font-size:.65rem;color:#888;text-transform:uppercase}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-btn{background:#fff;border:1px solid #ddd;padding:12px;border-radius:10px;text-align:center;cursor:pointer;border-left:4px solid var(--primary)}
.food-btn{border-left-color:var(--food)}
.add-btn{border-left-color:#7f8c8d}
.admin-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:15px;border-top:1px solid #ddd;display:flex;justify-content:space-around}
.btn-payout{background:var(--accent);color:white;border:none;padding:12px 25px;border-radius:5px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center}
</style>
</head>

<body>
<div class="container">

<header>
<h2 style="color:var(--primary)">☕ Bean & Bloom</h2>
<input type="date" id="work-date">
</header>

<div class="dashboard">
<div class="card"><span class="lbl">Sales</span><span class="val" id="total-s" style="color:green">0</span></div>
<div class="card"><span class="lbl">Expenses</span><span class="val" id="total-e" style="color:red">0</span></div>
<div class="card" style="background:var(--accent);color:white"><span class="lbl">Net</span><span class="val" id="total-n">0</span></div>
</div>

<div id="grid-hot" class="menu-grid"></div>

<div class="admin-nav">
<button onclick="location.href='inventory.html'">📦 Inventory</button>
<button onclick="location.href='floating.html'">💰 Floating</button>
<button id="auth-btn" onclick="handleAuth()">Admin Login</button>
</div>

</div>

<div id="qty-modal" class="modal">
<div style="background:white;padding:20px;border-radius:15px;text-align:center">
<h3 id="m-item"></h3>
<input type="number" id="m-qty" value="1" style="font-size:2rem;width:100px">
<br><br>
<button onclick="closeModal()">Cancel</button>
<button onclick="confirmSale()" style="background:var(--primary);color:white">Add</button>
</div>
</div>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyAKqsixs_luzjqCY1ZCqrKRtn77wcJs5Iw",
 authDomain:"bean-5a113.firebaseapp.com",
 projectId:"bean-5a113"
});

const db=firebase.firestore(), auth=firebase.auth();
const adminUID="Mo1oHKdvskXeuRjY8h1YFMT5vrl2";

const MENU=[{n:'ቡና',p:40,c:'hot'}];
let sel=null,isAdmin=false;

window.onload=()=>{
 work-date.value=new Date().toISOString().split('T')[0];
 renderMenu();
 auth.onAuthStateChanged(u=>{
   isAdmin=u&&u.uid===adminUID;
   auth-btn.innerText=isAdmin?"Logout":"Admin Login";
   sync();
 });
}

function renderMenu(){
 MENU.forEach(i=>{
   const b=document.createElement('div');
   b.className='menu-btn';
   b.innerHTML=`<b>${i.n}</b><br>${i.p} ETB`;
   b.onclick=()=>{sel=i;m-item.innerText=i.n;qty-modal.style.display='flex';};
   grid-hot.appendChild(b);
 });
}

async function confirmSale(){
 const q=Number(m-qty.value);
 if(!q) return;

 await db.collection('transactions').add({
   n:sel.n,q:q,p:sel.p*q,
   d:work-date.value,ex:false,ts:Date.now()
 });

 // 🔥 FLOATING ADD
 const fref=db.collection("floating").doc("today");
 const fd=await fref.get();
 let f=fd.exists?fd.data():{opening:0,in:0,out:0};
 f.in+=sel.p*q;
 await fref.set(f);

 // 🔥 INVENTORY DEDUCT
 const inv=await db.collection("inventory").where("name","==",sel.n).get();
 inv.forEach(d=>{
   const i=d.data();
   if(i.ratio){
     const used=q/i.ratio;
     db.collection("inventory").doc(d.id).update({qty:i.qty-used});
   }
 });

 closeModal();
}

async function saveEx(n,p){
 await db.collection('transactions').add({
   n:"OUT: "+n,q:1,p:p,d:work-date.value,ex:true,ts:Date.now()
 });

 const fref=db.collection("floating").doc("today");
 const fd=await fref.get();
 let f=fd.exists?fd.data():{opening:0,in:0,out:0};
 f.out+=p;
 await fref.set(f);
}

function sync(){
 db.collection('transactions').where('d','==',work-date.value)
 .onSnapshot(s=>{
   let ssum=0,esum=0;
   s.forEach(d=>{
     const t=d.data();
     t.ex?esum+=t.p:ssum+=t.p;
   });
   total-s.innerText=ssum;
   total-e.innerText=esum;
   total-n.innerText=(ssum-esum)+" ETB";
 });
}

function handleAuth(){
 if(auth.currentUser) auth.signOut();
 else{
   const e=prompt("Email"),p=prompt("Password");
   if(e&&p) auth.signInWithEmailAndPassword(e,p);
 }
}

function closeModal(){
 qty-modal.style.display='none';
 m-qty.value=1;
}
</script>
</body>
</html>
