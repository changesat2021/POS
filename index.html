<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coffeehouse POS - Professional Report</title>
    <style>
        :root {
            --primary: #6F4E37;
            --food-color: #d35400;
            --accent: #2c3e50;
            --light: #f8f9fa;
            --white: #ffffff;
            --danger: #c0392b;
            --success: #27ae60;
            --border: #e0e0e0;
            --shadow: 0 4px 6px rgba(0,0,0,0.08);
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--light); color: var(--accent); padding-bottom: 50px; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        
        /* --- HEADER & DATE --- */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--white); padding: 15px; border-radius: var(--radius); box-shadow: var(--shadow); }
        h1 { color: var(--primary); font-size: 1.2rem; }
        .date-input-group { text-align: right; }
        .date-input-group label { display: block; font-size: 0.7rem; font-weight: bold; color: #888; margin-bottom: 3px; }
        input[type="date"] { border: 1px solid var(--border); padding: 5px; border-radius: 4px; font-weight: bold; color: var(--primary); }

        /* --- DASHBOARD --- */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: var(--white); padding: 12px; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-label { font-size: 0.7rem; color: #777; text-transform: uppercase; font-weight: bold; }
        .card-value { font-size: 1.1rem; font-weight: 800; margin-top: 5px; }
        .card.net { background: var(--accent); color: var(--white); }

        /* --- MENU --- */
        .section-title { font-size: 0.9rem; color: #777; margin: 20px 0 10px 0; border-bottom: 2px solid #ddd; padding-bottom: 5px; text-transform: uppercase; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }

        .menu-btn {
            background: var(--white); border: 1px solid var(--border); border-left: 5px solid var(--primary);
            border-radius: var(--radius); padding: 15px 10px; cursor: pointer; text-align: center; transition: 0.1s;
        }
        .menu-btn.food-btn { border-left-color: var(--food-color); }
        .menu-btn:active { transform: scale(0.95); background: #eee; }
        .menu-btn h3 { font-size: 0.9rem; margin-bottom: 4px; }
        .menu-btn span { font-size: 0.8rem; font-weight: bold; color: #666; }

        /* --- LOGS TABLE --- */
        .log-section { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); margin-top: 20px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f4f4f4; color: #666; font-size: 0.75rem; }
        .col-right { text-align: right; }
        .text-food { color: var(--food-color); font-weight: bold; }
        .text-drink { color: var(--primary); font-weight: bold; }

        /* --- EXPENSE FORM --- */
        .expense-form { background: #fff; padding: 15px; border-radius: var(--radius); margin-top: 20px; border: 1px dashed #ccc; }
        .form-row { display: flex; gap: 5px; margin-bottom: 10px; }
        input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; }
        .modal-content input { width: 100%; font-size: 2rem; text-align: center; margin: 15px 0; border: 2px solid var(--primary); }
        .modal-btns { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-ok { background: var(--success); color: #fff; }
        .btn-cancel { background: #eee; }

        /* --- FOOTER ACTIONS --- */
        .footer-actions { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
        .btn-payout { background: var(--accent); color: white; padding: 15px; border-radius: var(--radius); border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }

        /* --- PRINT STYLES --- */
        @media print {
            .menu-grid, .expense-form, .footer-actions, header, .modal, .section-title { display: none !important; }
            body { background: white; padding: 0; }
            .container { max-width: 100%; width: 100%; }
            .log-section { box-shadow: none; border: 1px solid #000; }
            .dashboard { border: 1px solid #000; grid-template-columns: 1fr 1fr 1fr; }
            .print-only-header { display: block !important; text-align: center; margin-bottom: 20px; }
        }
        .print-only-header { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="print-only-header">
        <h1>COFFEE HOUSE - DAILY PAYOUT REPORT</h1>
        <h2 id="print-date"></h2>
    </div>

    <header>
        <h1>☕ POS System</h1>
        <div class="date-input-group">
            <label>Working Date</label>
            <input type="date" id="work-date" onchange="changeDate()">
        </div>
    </header>

    <div class="dashboard">
        <div class="card"><div class="card-label">Sales</div><div class="card-value text-success" id="total-sales">0</div></div>
        <div class="card"><div class="card-label">Expenses</div><div class="card-value text-danger" id="total-expenses">0</div></div>
        <div class="card net"><div class="card-label">Net Payout</div><div class="card-value" id="net-cash">0</div></div>
    </div>

    <div class="section-title">Drinks</div>
    <div id="drink-menu" class="menu-grid"></div>

    <div class="section-title">Foods</div>
    <div id="food-menu" class="menu-grid"></div>

    <div class="section-title">Daily Expense</div>
    <div class="expense-form">
        <div class="form-row">
            <input type="text" id="exp-name" placeholder="Expense description...">
            <input type="number" id="exp-price" placeholder="Amount" inputmode="numeric">
        </div>
        <div class="modal-btns">
            <button class="btn" style="background:var(--primary); color:white" onclick="addExp('drink')">Drink Expense</button>
            <button class="btn" style="background:var(--food-color); color:white" onclick="addExp('food')">Food Expense</button>
        </div>
    </div>

    <div class="section-title">Transaction Log</div>
    <div class="log-section">
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Item / Description</th>
                    <th>Qty</th>
                    <th class="col-right">Amount</th>
                </tr>
            </thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>

    <div class="footer-actions">
        <button class="btn-payout" onclick="printAndReset()">Finalize Payout & Save PDF</button>
    </div>
</div>

<div id="qty-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">Quantity</h2>
        <input type="number" id="qty-val" value="1" inputmode="numeric">
        <div class="modal-btns">
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-ok" onclick="confirmSale()">Add Sale</button>
        </div>
    </div>
</div>

<script>
    const MENU = [
        { id: 'c1', name: 'Coffee', price: 40, type: 'drink' },
        { id: 'c2', name: 'Tea', price: 25, type: 'drink' },
        { id: 'c3', name: 'Macchiato', price: 45, type: 'drink' },
        { id: 'c4', name: 'Milk', price: 30, type: 'drink' },
        { id: 'f1', name: 'Cake', price: 50, type: 'food' },
        { id: 'f2', name: 'Sandwich', price: 60, type: 'food' },
        { id: 'f3', name: 'Donut', price: 35, type: 'food' }
    ];

    let currentDayData = { transactions: [] };
    let activeItem = null;

    // Initialize
    window.onload = () => {
        // Set default date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('work-date').value = today;
        
        renderMenu();
        loadDay();
    };

    function renderMenu() {
        const dm = document.getElementById('drink-menu');
        const fm = document.getElementById('food-menu');
        MENU.forEach(item => {
            const b = document.createElement('div');
            b.className = `menu-btn ${item.type === 'food' ? 'food-btn' : ''}`;
            b.innerHTML = `<h3>${item.name}</h3><span>${item.price} ETB</span>`;
            b.onclick = () => openModal(item);
            (item.type === 'drink' ? dm : fm).appendChild(b);
        });
    }

    function openModal(item) {
        activeItem = item;
        document.getElementById('modal-title').innerText = item.name;
        document.getElementById('qty-val').value = 1;
        document.getElementById('qty-modal').style.display = 'flex';
        document.getElementById('qty-val').select();
    }

    function closeModal() {
        document.getElementById('qty-modal').style.display = 'none';
    }

    function changeDate() {
        loadDay();
    }

    function confirmSale() {
        const qty = parseInt(document.getElementById('qty-val').value);
        if(!qty || qty < 1) return;

        const entry = {
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            name: activeItem.name,
            qty: qty,
            price: activeItem.price * qty,
            isExpense: false,
            type: activeItem.type
        };

        currentDayData.transactions.push(entry);
        saveAndRefresh();
        closeModal();
    }

    function addExp(type) {
        const name = document.getElementById('exp-name').value;
        const price = parseFloat(document.getElementById('exp-price').value);
        if(!name || !price) return alert("Fill expense details");

        currentDayData.transactions.push({
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            name: `EXPENSE: ${name}`,
            qty: '-',
            price: -price,
            isExpense: true,
            type: type
        });
        
        document.getElementById('exp-name').value = '';
        document.getElementById('exp-price').value = '';
        saveAndRefresh();
    }

    function saveAndRefresh() {
        const date = document.getElementById('work-date').value;
        localStorage.setItem(`pos_${date}`, JSON.stringify(currentDayData));
        renderUI();
    }

    function loadDay() {
        const date = document.getElementById('work-date').value;
        const saved = localStorage.getItem(`pos_${date}`);
        currentDayData = saved ? JSON.parse(saved) : { transactions: [] };
        renderUI();
    }

    function renderUI() {
        const body = document.getElementById('log-body');
        body.innerHTML = '';
        let sales = 0; let exps = 0;

        // Transactions are rendered as individual rows (Separate sold outs)
        currentDayData.transactions.forEach((t, index) => {
            if(!t.isExpense) sales += t.price;
            else exps += Math.abs(t.price);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${t.time}</td>
                <td class="${t.isExpense ? 'text-danger' : (t.type === 'food' ? 'text-food' : 'text-drink')}">${t.name}</td>
                <td>${t.qty}</td>
                <td class="col-right">${t.price} ETB</td>
            `;
            body.prepend(tr); // Newest on top
        });

        document.getElementById('total-sales').innerText = sales + " ETB";
        document.getElementById('total-expenses').innerText = exps + " ETB";
        document.getElementById('net-cash').innerText = (sales - exps) + " ETB";
    }

    function printAndReset() {
        if(currentDayData.transactions.length === 0) return alert("No data to save.");

        // Set date for print header
        document.getElementById('print-date').innerText = "Date: " + document.getElementById('work-date').value;

        // Trigger PDF/Print
        window.print();

        // After printing, offer reset
        setTimeout(() => {
            if(confirm("Report saved? Click OK to clear current day data and reset payout to zero.")) {
                const date = document.getElementById('work-date').value;
                localStorage.removeItem(`pos_${date}`);
                loadDay();
            }
        }, 1000);
    }
</script>
</body>
</html>
