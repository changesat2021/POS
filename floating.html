<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating / Tabs</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f4f4f4; padding-bottom: 80px; }
        .nav-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-link { flex: 1; padding: 10px; text-align: center; background: #ddd; color: #333; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .active { background: #e67e22; color: white; }
        
        .debt-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #e74c3c; }
        .btn-settle { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .admin-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; border-top: 1px solid #ddd; text-align: center; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="nav-link">POS</a>
    <a href="inventory.html" class="nav-link">Inventory</a>
    <a href="floating.html" class="nav-link active">Floating/Tabs</a>
</div>

<h2>📒 Floating Accounts (Unpaid)</h2>
<div id="float-list">Waiting for login...</div>

<div class="admin-nav">
    <button id="auth-btn" onclick="handleAuth()" style="background:none; border:none; text-decoration:underline; color:blue;">Login to View Debts</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAKqsixs_luzjqCY1ZCqrKRtn77wcJs5Iw",
        authDomain: "bean-5a113.firebaseapp.com",
        projectId: "bean-5a113",
        storageBucket: "bean-5a113.firebasestorage.app",
        messagingSenderId: "702927377502",
        appId: "1:702927377502:web:9e50192a0c431da69850cf"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(), auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-btn').innerText = "Logout Admin";
            document.getElementById('float-list').innerText = "Loading...";
            loadFloating();
        } else {
            document.getElementById('auth-btn').innerText = "Login to View Debts";
            document.getElementById('float-list').innerText = "Restricted Access. Please Login.";
        }
    });

    function loadFloating() {
        // Only show Unresolved (Unpaid) debts
        db.collection('floating').where('resolved', '==', false).onSnapshot(snap => {
            let html = '';
            if(snap.empty) {
                document.getElementById('float-list').innerHTML = '<p>No outstanding debts found.</p>';
                return;
            }
            
            snap.forEach(doc => {
                const d = doc.data();
                html += `<div class="debt-card">
                    <div>
                        <h3 style="margin:0">${d.name}</h3>
                        <small>${d.item} - ${d.date}</small>
                    </div>
                    <div style="text-align:right">
                        <strong style="display:block; font-size:1.2rem">${d.amount} ETB</strong>
                        <button class="btn-settle" onclick="settle('${doc.id}', '${d.name}', ${d.amount})">Pay / Settle</button>
                    </div>
                </div>`;
            });
            document.getElementById('float-list').innerHTML = html;
        }, error => {
            alert("Database Error: " + error.message);
        });
    }

    async function settle(docId, name, amount) {
        if(confirm(`Confirm payment of ${amount} ETB from ${name}?`)) {
            try {
                // 1. Mark as resolved
                await db.collection('floating').doc(docId).update({ resolved: true });
                
                // 2. Add cash to today's transaction
                const today = new Date().toISOString().split('T')[0];
                await db.collection('transactions').add({
                    n: `PAYMENT: ${name}`,
                    q: 1,
                    p: amount,
                    d: today,
                    ex: false,
                    ts: Date.now(),
                    isCredit: false,
                    isPaid: true
                });
                alert("Debt Settled & Added to Daily Sales");
            } catch (e) {
                alert("Error: " + e.message);
            }
        }
    }

    async function handleAuth() {
        if(auth.currentUser) { auth.signOut(); } 
        else {
            const email = prompt("Email:");
            const pass = prompt("Password:");
            if(email && pass) await auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
        }
    }
</script>
</body>
</html>
